name: workreport_mobile
description: "WorkReport AI — 현장 작업자용 Offline-first Flutter 앱"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 로컬 DB (오프라인 저장 — 설계서 5.1, 5.2)
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # 네트워크 / 동기화
  dio: ^5.5.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.2
  flutter_secure_storage: ^9.2.2

  # 현장 기록 입력
  camera: ^0.11.0
  image_picker: ^1.1.2
  record: ^5.1.2 # 음성 녹음
  mobile_scanner: ^5.2.3 # QR 스캔 (설비 식별)

  # 라우팅
  go_router: ^14.2.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.19.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
